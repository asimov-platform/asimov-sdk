# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["lib/*"]
#default-members = []
resolver = "2"

[workspace.package]
version = "25.3.4"
authors = ["ASIMOV Systems <support@asimov.systems>"]
edition = "2024"
rust-version = "1.97.1"
description = "ASIMOV Software Development Kit (SDK) for Rust"
#documentation = "https://docs.rs/asimov-sdk"
readme = true
homepage = "https://sdk.asimov.sh"
repository = "https://github.com/asimov-platform/asimov.rs"
license = "Unlicense"
keywords = ["asimov", "ai", "sdk"]
categories = []
publish = true

[workspace.dependencies]
asimov-account = { version = "25.3.4", default-features = false }
asimov-agent = { version = "25.3.4", default-features = false }
asimov-cache = { version = "25.3.4", default-features = false }
asimov-cloud = { version = "25.3.4", default-features = false }
asimov-config = { version = "25.3.4", default-features = false }
asimov-construct = { version = "25.3.4", default-features = false }
asimov-core = { version = "25.3.4", default-features = false }
asimov-credit = { version = "25.3.4", default-features = false }
asimov-dataset = { version = "25.3.4", default-features = false }
asimov-directory = { version = "25.3.4", default-features = false }
asimov-env = { version = "25.3.4", default-features = false }
asimov-flow = { version = "25.3.4", default-features = false }
asimov-graph = { version = "25.3.4", default-features = false }
asimov-huggingface = { version = "25.3.4", default-features = false }
asimov-id = { version = "25.3.4", default-features = false }
asimov-installer = { version = "25.3.4", default-features = false }
asimov-kb = { version = "25.3.4", default-features = false }
asimov-ledger = { version = "25.3.4", default-features = false }
asimov-module = { version =  "25.3.4", default-features = false }
asimov-module-kit = { version = "25.3.4", default-features = false }
asimov-nexus = { version = "25.3.4", default-features = false }
asimov-ontology = { version = "25.3.4", default-features = false }
asimov-patterns = { version = "25.3.4", default-features = false }
asimov-platform = { version = "25.3.4", default-features = false }
asimov-prompt = { version = "25.3.4", default-features = false }
asimov-protocol = { version = "25.3.4", default-features = false }
asimov-proxy = { version = "25.3.4", default-features = false }
asimov-registry = { version = "25.3.4", default-features = false }
asimov-repository = { version = "25.3.4", default-features = false }
asimov-runner = { version = "25.3.4", default-features = false }
asimov-runtime = { version = "25.3.4", default-features = false }
asimov-sdk = { version = "25.3.4", default-features = false }
asimov-server = { version = "25.3.4", default-features = false }
asimov-snapshot = { version = "25.3.4", default-features = false }
asimov-token = { version = "25.3.4", default-features = false }
asimov-universe = { version = "25.3.4", default-features = false }
asimov-vault = { version = "25.3.4", default-features = false }

# Interoperability with RDF.rs:
rdf-format = { version = "0.4.4", default-features = false, features = ["alloc"] }
rdf-hash = { version = "0.4.4", default-features = false, features = ["alloc"] }
rdf-id = { version = "0.4.4", default-features = false, features = ["alloc"] }
rdf-message = { version = "0.4.4", default-features = false, features = ["alloc"] }
rdf-model = { version = "0.4.4", default-features = false, features = ["alloc"] }
rdf-vocab = { version = "0.4.4", default-features = false, features = ["alloc"] }
xsd = { version = "0.4.4", default-features = false, features = ["alloc"] }

# Implementation with Valuand:
valuand = { version = "0.1", default-features = false }

# Implementation with Iroh:
edky = { version = "0.1", default-features = false }
iroh = { version = "1.0", default-features = false }
iroh-blobs = { version = "0.103", default-features = false }
iroh-gossip = { version = "0.101", default-features = false }
iroh-metrics = { version = "1.0", default-features = false }
iroh-services = { version = "1.0", default-features = false }
iroh-tickets = { version = "1.0", default-features = false }
n0-error = { version = "1.0", default-features = false }

# Implementation with p2panda:
p2panda-core = { version = "0.7", default-features = false}

# Implementation with Tokio:
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", default-features = false }

alloy = { version = "2.2", default-features = false }
anyhow = { version = "1", default-features = false }
async-flow = { version = "0.1.5", default-features = false }
async-graphql = { version = "7.2", default-features = false }
async-stream = { version = "0.3", default-features = false }
async-trait = { version = "0.1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["macros"] }
axum-embed = { version = "0.1", default-features = false }
axum-prometheus = { version = "0.10", default-features = false, features = [
    "prometheus",
] }
axum-test = { version = "17.3", default-features = false }
blake3 = { version = "1.8", default-features = false }
bon = { version = "3.6", default-features = false }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
bytes = { version = "1.10", default-features = false }
camino = { version = "1.2", default-features = false }
cap-directories = { version = "4.0", default-features = false }
cap-std = { version = "4.0", default-features = false, features = ["fs_utf8"] }
cargo-generate = { version = "0.23", default-features = false }
cfg_aliases = { version = "0.2", default-features = false }
clap = { version = "4.5", default-features = false }
clientele = { version = "0.3.8", default-features = false, features = [
    "argfile",
    "dotenv",
    "wild",
] }
csv-async = { version = "1.3", default-features = false }
data-encoding = { version = "2.11", default-features = false }
data-encoding-macro = { version = "0.1", default-features = false }
derive_more = { version = "2", default-features = false }
dogma = { version = "0.2.1", default-features = false, features = ["traits"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }
eloquent = { version = "2.1", default-features = false }
fastrand = { version = "2.4", default-features = false }
flate2 = { version = "1", default-features = false }
flows = { version = "0.0.6", default-features = false }
futures = { version = "0.3", default-features = false }
futures-lite = { version = "2.6", default-features = false }
getenv = { version = "0.1.2", default-features = false, features = [
    "cargo",
    "posix",
    "python",
    "ruby",
    "windows",
] }
gofer = { version = "0.2.0", default-features = false, features = [
    "all",
    "miette",
] }
git2 = { version = "0.21", default-features = false, features = [
    "https",
    "ssh",
] }
heapless = { version = "0.9", default-features = false }
hex = { version = "0.4", default-features = false }
hf-hub = { version = "0.4.2", default-features = false, features = ["ureq"] }
http = { version = "1.3", default-features = false }
http-body-util = { version = "0.1", default-features = false }
indicatif = "0.17.11"
jiff = { version = "0.2", default-features = false }
know = { version = "0", default-features = true }
known-errors = { version = "0.1", default-features = false, features = ["sysexits"] }
kstring = { version = "=2.0.2", default-features = false }
lazy_static = { version = "1.5", default-features = false }
libloading = { version = "0.8", default-features = false }
libsql = { version = "0.9", default-features = false }
liquid = { version = "0.26", default-features = false, features = ["stdlib"] }
local-ip-address = { version = "0.6", default-features = false }
mdns-sd = { version = "0.20", default-features = false }
miette = { version = "7.6", default-features = false, features = ["derive"] }
num-derive = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
openai = { package = "known-types-openai", version = "0.0.8", default-features = false, features = [
    "alloc",
] }
postcard = { version = "1.1", default-features = false, features = ["heapless"] }
rmcp = { version = "0.1.5", default-features = false }
#rmcp = { version = "0.2.1", default-features = false } # FIXME
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "rustls-tls-native-roots",
] }
rocket = { version = "0.5", default-features = false }
rust-embed = { version = "8.7", default-features = false, features = [
    "deterministic-timestamps",
] }
secrecy = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde_yaml_ng = { version = "0.10.0", default-features = false }
serde_with = { version = "3.18", default-features = false }
sha2 = { version = "0.10", default-features = false }
slab = { version = "0.4.10", default-features = false }
stability = { version = "0.2", default-features = false }
tar = { version = "0.4", default-features = false }
tempfile = { version = "3.20", default-features = false }
thiserror = { version = "2", default-features = false }
tldr = { version = "0.1", package = "tldr-traits", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse"] }
toml_edit = { version = "0.25", default-features = false, features = [
    "parse",
    "display",
] }
tower-http = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "alloc",
    "tracing-log",
] }
turso = { version = "0.4", default-features = false }
url = { version = "2.5", default-features = false }
uuid = { version = "1.23", default-features = false, features = ["v7"] }
zip = { version = "8", default-features = false }

