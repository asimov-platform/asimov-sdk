# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-prompt"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = [
    "text-processing",
    "data-structures",
    "value-formatting",
    "encoding",
    "parsing",
]
publish.workspace = true

[package.metadata.readme]
title = "ASIMOV.rs: Prompt Types"

[features]
default = ["all", "std"]
all = ["tracing"]
std = ["asimov-core/std", "derive_more/std", "openai?/std"]
tracing = []
unstable = []

[dependencies]
asimov-core.workspace = true
bon.workspace = true
derive_more = { workspace = true, features = ["display", "from", "from_str"] }

# Optional dependencies:
openai = { workspace = true, optional = true }

[dev-dependencies]
openai = { workspace = true, features = ["serde"] }
serde_json.workspace = true

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
