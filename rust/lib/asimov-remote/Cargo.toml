# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-remote"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Remote execution of ASIMOV component patterns"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["all", "std"]
all = ["http", "iroh", "serde"]
std = ["asimov-flow?/std", "asimov-http?/std", "asimov-id?/std", "asimov-keyring?/std", "asimov-patterns/std", "clientele?/std", "rustls?/std", "serde?/std", "serde_json?/std"]
# Transport adapters:
http = ["std", "serde", "dep:asimov-flow", "asimov-flow/tokio", "dep:asimov-http", "dep:asimov-id", "dep:asimov-keyring", "dep:agent-detector", "dep:async-trait", "dep:base64", "dep:http-body-util", "dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier", "dep:secrecy", "dep:serde_json", "dep:thiserror", "dep:tokio"]
iroh = []
# Transport-independent request encodings:
jcs = ["std", "serde", "dep:serde_json", "dep:serde_json_canonicalizer"]
serde = ["dep:clientele", "dep:serde", "asimov-patterns/serde"]
unstable = []

[dependencies]
asimov-flow = { workspace = true, optional = true }
asimov-http = { workspace = true, optional = true }
asimov-id = { workspace = true, optional = true }
asimov-keyring = { workspace = true, optional = true }
asimov-patterns.workspace = true
agent-detector = { workspace = true, optional = true, features = ["process-tree"] }
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, features = ["alloc"], optional = true }
clientele = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["http2", "json", "socks", "stream", "system-proxy"], optional = true }
rustls = { workspace = true, features = ["ring", "tls12"], optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_json_canonicalizer = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }

[dev-dependencies]
base64 = { workspace = true, features = ["alloc"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true, features = ["crypto", "ring"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
tokio-rustls.workspace = true
whoami = { workspace = true, features = ["std"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
