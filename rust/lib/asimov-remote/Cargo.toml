# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-remote"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Remote execution of ASIMOV component patterns"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["all", "std"]
all = ["http", "iroh"]
std = ["asimov-flow/std", "asimov-id?/std", "asimov-keyring?/std", "asimov-patterns/std"]
http = ["std", "asimov-flow/tokio", "dep:asimov-id", "dep:asimov-keyring", "dep:agent-detector", "dep:humantime", "dep:reqwest", "dep:secrecy", "dep:serde", "dep:thiserror"]
iroh = []
unstable = []

[dependencies]
asimov-flow.workspace = true
asimov-id = { workspace = true, optional = true }
asimov-keyring = { workspace = true, optional = true }
asimov-patterns.workspace = true
agent-detector = { workspace = true, optional = true, features = ["process-tree"] }
async-trait.workspace = true
humantime = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["http2", "json", "stream"], optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
http-body-util.workspace = true
hyper = { version = "1", default-features = false, features = ["server", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
whoami = { workspace = true, features = ["std"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
