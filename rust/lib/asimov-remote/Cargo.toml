# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-remote"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Remote execution of ASIMOV component patterns"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
default = ["all", "std"]
all = ["http", "iroh", "serde"]
std = ["asimov-flow?/std", "asimov-id?/std", "asimov-keyring?/std", "asimov-patterns/std", "base64?/std", "clientele?/std", "serde?/std", "serde_json?/std", "sha2?/std"]
# Transport adapters:
http = ["std", "serde", "dep:asimov-flow", "asimov-flow/tokio", "dep:asimov-id", "dep:asimov-keyring", "dep:agent-detector", "dep:async-trait", "dep:base64", "dep:reqwest", "dep:secrecy", "dep:sha2", "dep:thiserror"]
iroh = []
# Transport-independent request encodings:
jcs = ["std", "serde", "dep:serde_json", "dep:serde_json_canonicalizer"]
serde = ["dep:clientele", "dep:serde", "asimov-patterns/serde"]
unstable = []

[dependencies]
asimov-flow = { workspace = true, optional = true }
asimov-id = { workspace = true, optional = true }
asimov-keyring = { workspace = true, optional = true }
asimov-patterns.workspace = true
agent-detector = { workspace = true, optional = true, features = ["process-tree"] }
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true, features = ["alloc"] }
clientele = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["http2", "json", "stream"], optional = true }
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_json_canonicalizer = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
http-body-util.workspace = true
hyper = { version = "1", default-features = false, features = ["server", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
whoami = { workspace = true, features = ["std"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
