# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-patterns"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["text-processing", "parsing", "rust-patterns"]
publish.workspace = true

[package.metadata.readme]
title = "ASIMOV.rs: Program Patterns"

[features]
default = ["all", "std"]
all = []
std = ["asimov-core/std", "clientele/std", "dep:humantime"]
unstable = []

# Features:
tracing = []

# Interoperability:
clap = ["dep:clap", "dep:humantime"]
serde = ["dep:serde", "dep:humantime"]

[dependencies]
asimov-core.workspace = true
async-trait.workspace = true
bon.workspace = true
clientele = { workspace = true, features = ["clap"] }
humantime = { workspace = true, optional = true }
rdf-model.workspace = true

# Interoperability:
clap = { workspace = true, features = ["derive", "std"], optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
