# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-module"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["api-bindings", "development-tools"]
publish.workspace = true

[package.metadata.readme]
title = "ASIMOV.rs: Module Support"

[features]
default = ["all", "std"]
all = ["cli", "index", "tracing", "serde", "asimov-env?/all"]
cli = ["std", "dep:clientele", "clientele?/clap"]
std = [
  "asimov-core/std",
  "clientele?/std",
  "dep:asimov-env",
  "asimov-env?/std",
  "dep:getenv",
  "getenv?/std",
  "iri-string/std",
  "serde_json?/std",
  "serde?/std",
  "slab/std",
  "thiserror/std",
  "tracing-subscriber?/fmt",
  "tracing-subscriber?/std",
  "tracing?/std",
  "url/std",
]
unstable = []

# Optional features:
index = ["std", "serde", "tracing", "dep:reqwest"]
json = ["dep:serde_json"]
serde = ["dep:serde", "json", "yaml"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "clientele?/tracing"]
yaml = ["dep:serde_yaml_ng"]

[dependencies]
asimov-core.workspace = true
secrecy.workspace = true
slab.workspace = true
thiserror.workspace = true
url.workspace = true
iri-string = { version = "0.7", default-features = false, features = ["alloc"] }
mime = { version = "0.3", default-features = false }

# Optional dependencies:
asimov-env = { workspace = true, optional = true }
clientele = { workspace = true, optional = true }
getenv = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml_ng = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
serde_yaml_ng = { workspace = true }
tempfile.workspace = true

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
