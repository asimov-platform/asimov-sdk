# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-directory"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.readme]
title = "ASIMOV.rs: State Management"

[features]
default = ["all", "std"]
all = ["fs"]
std = ["asimov-core/std", "asimov-protocol/std", "url/std"]
unstable = []

# Features:
fs = ["std", "dep:camino", "dep:cap-fs-ext", "dep:cap-tempfile", "dep:tokio"]
tracing = []

# Integrations:
camino = ["dep:camino"]
tokio = ["dep:tokio"]

[dependencies]
asimov-config.workspace = true
asimov-core.workspace = true
asimov-module = { workspace = true, features = ["serde"] }
asimov-protocol = { workspace = true, features = ["csv"] }
derive_more = { workspace = true, features = ["display"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
url.workspace = true

# Integrations:
camino = { workspace = true, optional = true }
cap-fs-ext = { workspace = true, features = ["std"], optional = true }
cap-tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs"], optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
