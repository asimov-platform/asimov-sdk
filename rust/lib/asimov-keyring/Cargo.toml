# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-keyring"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.readme]
title = "ASIMOV.rs: Keyring"

[features]
default = ["all", "std"]
std = [
    "asimov-core/std",
    "dep:apple-native-keyring-store",
    "dep:bs58",
    "dep:cap-tempfile",
    "dep:secret-service",
    "dep:whoami",
    "dep:windows-native-keyring-store",
    "dep:zbus",
    "dep:zbus-secret-service-keyring-store",
]
unstable = []

# Features:
all = []

# Interoperability:
clap = ["dep:clap"]
serde = ["dep:serde"]
tracing = ["dep:tracing"]

[dependencies]
asimov-core.workspace = true
asimov-directory = { workspace = true, features = ["fs"] }
asimov-id = { workspace = true, features = ["iroh"] }
derive_more = { workspace = true, features = ["debug", "display", "from", "from_str"] }
iroh-base = { workspace = true, features = ["key"] }
keyring-core.workspace = true
secrecy.workspace = true
thiserror.workspace = true

# Features:
cap-tempfile = { workspace = true, optional = true }

# Interoperability:
clap = { workspace = true, features = ["derive", "std"], optional = true }
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
whoami = { workspace = true, features = ["std"], optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
bs58 = { workspace = true, optional = true }
secret-service = { version = "5", default-features = false, optional = true }
zbus = { version = "5", default-features = false, optional = true }
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-async-io-crypto-rust"], optional = true }

[dev-dependencies]
tempfile.workspace = true

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
