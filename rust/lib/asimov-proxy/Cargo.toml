# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-proxy"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.readme]
title = "ASIMOV.rs: Proxy Support"

[features]
default = ["all", "std"]
all = ["tracing"]
std = [
    "base64/std",
    "percent-encoding/std",
    "thiserror/std",
    "url/std",
    "tracing?/std",
    "dep:axum",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:rustls",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tokio-socks",
    "dep:tower-service",
]
unstable = []

# Features:
tracing = ["dep:tracing"]

[dependencies]
base64 = { workspace = true, features = ["alloc"] }
percent-encoding = { workspace = true, features = ["alloc"] }
thiserror.workspace = true
url.workspace = true

# Optional dependencies:
axum = { workspace = true, features = ["http1", "tokio"], optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-rustls = { workspace = true, features = [
    "http1",
    "native-tokio",
    "ring",
    "tls12",
], optional = true }
hyper-util = { workspace = true, features = [
    "client-legacy",
    "http1",
    "tokio",
], optional = true }
rustls = { workspace = true, features = ["ring", "std", "tls12"], optional = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"], optional = true }
tokio-rustls = { workspace = true, features = ["ring", "tls12"], optional = true }
tokio-socks = { workspace = true, features = ["tokio"], optional = true }
tower-service = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
futures-lite = { workspace = true, features = ["std"] }
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
