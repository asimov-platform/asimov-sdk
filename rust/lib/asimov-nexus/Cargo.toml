# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-nexus"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
#documentation.workspace = true
readme = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.readme]
title = "ASIMOV.rs: Nexus Client"

[features]
default = ["all", "std"]
all = ["tracing"]
std = ["asimov-core/std"]
tracing = []
unstable = []

# Integrations:
validator = ["dep:validator"]

[dependencies]
asimov-core.workspace = true
asimov-kb.workspace = true
derive_more = { version = "2", features = ["display"] }
serde.workspace = true

# Integrations:
validator = { version = "0.21.0", default-features = false, optional = true }

# Preview locally with: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
