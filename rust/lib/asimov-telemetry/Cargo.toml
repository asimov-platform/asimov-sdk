# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-telemetry"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[package.metadata.readme]
title = "ASIMOV.rs: Telemetry"

[features]
default = ["all", "std"]
all = []
std = [
    "dep:asimov-http",
    "asimov-http/reqwest",
    "dep:agent-detector",
    "dep:bs58",
    "dep:dogma-uuid",
    "dep:reqwest",
    "dep:tokio",
    "serde/std",
    "serde_json/std",
]

[dependencies]
asimov-http = { workspace = true, optional = true }
agent-detector = { workspace = true, optional = true, features = ["process-tree"] }
bs58 = { workspace = true, optional = true }
dogma-uuid = { workspace = true, optional = true, features = ["std", "v4", "v7"] }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }
