# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-telemetry"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = true

[package.metadata.readme]
title = "ASIMOV.rs: Telemetry"

[features]
default = ["all", "std"]
all = []
std = [
    "dep:agent-detector",
    "dep:reqwest",
    "dep:tokio",
    "dep:uuid",
    "serde/std",
    "serde_json/std",
]

[dependencies]
agent-detector = { workspace = true, optional = true, features = ["process-tree"] }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "time"] }
uuid = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }
